[versions]
agp = "8.13.0"
core = "1.19.0"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
vectordrawable = "1.2.0"
lifecycleLivedata = "2.12.0-alpha03"
lifecycleViewmodel = "2.12.0-alpha03"
navigationFragment = "2.10.1"
navigationUi = "2.10.1"
jme3 = "3.9-Stable"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-vectordrawable = { group = "androidx.vectordrawable", name = "vectordrawable", version.ref = "vectordrawable" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycleLivedata" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycleViewmodel" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigationFragment" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigationUi" }
jme3-core = { group = "org.jmonkeyengine", name = "jme3-core" version.ref = "jme3" }
jme3-effects = { group = "org.jmonkeyengine", name = "jme3-effects" version.ref = "jme3" }
jme3-terrain = { group = "org.jmonkeyengine", name = "jme3-terrain" version.ref = "jme3" }
jme3-jbullet = { group = "org.jmonkeyengine", name = "jme3-jbullet" version.ref = "jme3" }